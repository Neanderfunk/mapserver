#
# locator.ffnef.de: Annahme der HVB-Ortung (Konzept Neanderfunk/packages
# docs/konzept-hvb-ortung.md, Entscheidung E7). Gluon-Knoten in 25_hvb
# schicken einmal am Tag per POST ihren WLAN-Scan. TLS endet auf dem Proxy
# davor; der reicht http und https ohne Umleitung durch, weil Knoten ohne
# TLS im Image http nehmen und ein POST keine 301 uebersteht.
#
# Seit 20.11.2026: POST auf /hvb/locate geht an locator/annahme.py
# (nur Loopback), der jede gueltige Meldung roh ablegt, 14 Tage lang.
# Eingerichtet von locator/einrichten.sh.
server {
	listen 80;
	listen [::]:80;
	server_name locator.ffnef.de;

	# Kein Inhalt im Log: nur Zeit, Absender laut Proxy, Anfrage, Status
	access_log /var/log/nginx/locator.log karte_locator;
	client_max_body_size 64k;

	location = /hvb/locate {
		if ($request_method != POST) {
			return 405;
		}
		proxy_pass http://127.0.0.1:8781;
		# vom Proxy auf twin2: die Adresse des Knotens
		proxy_set_header X-Forwarded-For $http_x_forwarded_for;
		proxy_set_header Host $host;
	}

	# HVB-Manifest des nodeplacer (Konzept 4.5, D-045): Mirror
	# http://locator.ffnef.de/hvb/nodeplacer, Datei nodeplacer.manifest.
	# Erzeugt und signiert von locator-manifest.timer. Nur http noetig,
	# nodeplacer-fetch kann kein TLS; https geht ueber den Proxy trotzdem.
	location = /hvb/nodeplacer/nodeplacer.manifest {
		alias /var/www/locator/hvb/nodeplacer/nodeplacer.manifest;
		default_type text/plain;
		add_header Cache-Control "no-cache";
	}

	location /hvb/nodeplacer {
		return 404;
	}

	location / {
		return 404;
	}
}
