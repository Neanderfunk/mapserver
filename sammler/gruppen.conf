# Sammelkarten: mehrere Domains einer Community auf einer Karte.
# Gelesen von yanic-conf.py (eigene Ausgabe mit den site_codes aller
# Mitglieder) und konfig-erzeugen.py (eigener Vhost), liegt auf der VM als
# /etc/karte-en/gruppen.conf.
#
# Spalten: Community, Ort (Pfad sites/<community>/<ort>, darf keinem Host aus
# domains.conf gleichen), Domaincodes mit Komma, danach der Name.
#
# LVR wie in der alten Kartenkonfiguration (eulenfunk/mapconfig, Gruppe LVR):
# lvr.karte.neanderfunk.de zeigt nur diese Domains (adorfer 04.11.2026).
neander  lvr  11_lvr,31_lvrno,32_lvrnw,33_lvrmo,34_lvrmw,35_lvrso,36_lvrsw  Freifunk LVR-HPH
