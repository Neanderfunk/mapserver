# Welchen site_code die Knoten je Domain melden.
#
# Die Regel steht in sites.nefall.sta des Firmware-Baums: der gemeldete
# site_code ist META_PREFIX (Spalte 9) plus Bindestrich plus SITE_CODE
# (Spalte 4). Die Praefixe unterscheiden sich je Domain: nef, dus, bgl,
# lvrno und so weiter. Geraete mit 4/32 MB (die 841er) laufen in einer
# eigenen Variante mit dem Anhang _EOL.
#
# Quelle: github.com/Neanderfunk/firmware, Zweig v2023.2.x, geholt
# am 20.09.2026. Gegenprobe im Netz mit
# sitecodes-ermitteln.py, das dieselbe Datei erzeugen kann.
#
