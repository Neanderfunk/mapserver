# Domains, die dieser Kartenserver mitmisst.
#
# Spalten, durch Leerraum getrennt. Die letzte Spalte darf Leerzeichen
# enthalten, alle davor nicht.
#
#   gem       Gemeinschaft, zugleich Namensraum: <gem>.map.freifunk.space
#   code      site_code; Instanzname der Unit, Suffix der Schnittstellen,
#             Filter in der yanic-Ausgabe. Muss ueber alle Gemeinschaften
#             eindeutig sein.
#   ordner    Herkunft auf ihrem Imageserver, nur zur Nachvollziehbarkeit
#   port      Tunneldigger-Port dieser Domain
#   id        lokale Tunnel-ID und viertes/letztes MAC-Byte. Eindeutig ueber
#             alle Domains, und danach unveraenderlich: sie steckt in unserer
#             Originator-Adresse im fremden Mesh.
#   host      Namensteil unter <gem>.map.freifunk.space
#   mtu       Tunnel-MTU aus ihrer site.json (EN 1420, Neanderfunk 1364)
#   broker    Brokerliste, durch Komma getrennt, ohne Port
#   prefix6   ihr IPv6-Praefix (Doku; wir belegen daraus nichts von Hand)
#   prefix4   ihr IPv4-Netz (Doku)
#   name      Klartextname
#
# gem     code   ordner        port   id host          mtu  broker                                   prefix6                   prefix4        name
