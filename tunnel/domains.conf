# Die acht Domains von Freifunk EN, gelesen am 20.09.2026 aus den site.json
# der Images unter https://images.freifunk-en.de/ (Firmware_2025.1.1_v4.2).
# Jede Domain ist eine eigene batman-Instanz mit eigenem Broker-Port, eigenem
# Praefix und eigenem domain_seed. Es gibt keine Multidomain-Firmware.
#
# Spalten, durch Leerraum getrennt:
#   code      site_code aus der site.json, zugleich Instanzname der Units
#   ordner    Verzeichnis auf ihrem Imageserver
#   port      Tunneldigger-Port auf broker1/broker2.ff-en.de
#   id        lokale Tunnel-ID und letztes MAC-Byte, muss eindeutig sein
#   host      Namensteil unter *.en.map.freifunk.space
#   prefix6   ihr IPv6-Praefix (nur zur Doku, wir belegen daraus nichts)
#   prefix4   ihr IPv4-Netz (dito)
#   name      Klartextname aus der site.json
#
# code   ordner        port   id host          prefix6                    prefix4       name
