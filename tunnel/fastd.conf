# Domains, die statt Tunneldigger per fastd ins Mesh gehen.
#
# Steht eine Domain aus domains.conf auch hier, startet tunnel-start.sh fastd
# statt des Tunneldigger-Clients. Alles andere bleibt gleich: dieselbe
# Schnittstelle td-<code>, derselbe Hook, dieselbe batman-Instanz, derselbe
# Watchdog. Port und MTU kommen weiter aus domains.conf.
#
# Unser Schluessel ist je Community einer (/etc/karte-en/fastd/<community>.secret,
# beim ersten Start erzeugt). Wer uns sperren oder freischalten will, sieht so
# genau eine Kennung je Community. Der oeffentliche Teil liegt daneben in
# <community>.pub.
#
# Spalten: code, Methoden (Komma, Reihenfolge wie bei Gluon), dann je Peer
# name=host=schluessel. Alle Peers kommen in eine Gruppe mit limit 1, wie auf
# einem Gluon-Knoten: fastd verbindet sich mit dem ersten, der antwortet.
#
# code  methoden        peers
# --- Freifunk Essen -----------------------------------------------------------
# site.conf: github.com/bwildenhain/site-ffe (Gluon v2019.1); Gegenseite in
# github.com/FFEssen/supernode-ansible (fastd_essen.conf.j2, 25.09.2026):
# Port 10000, salsa2012+umac und null, MTU 1280, on verify nur mit Sperrliste.
# Von den vier Supernodes loest am 25.09.2026 nur sn-a.hz.nue auf.
ffe   salsa2012+umac  node01=sn-a.hz.nue.ff-e.net=6e3c1e8713e2366fb514175a9beea81c238a5f5b59adf70242472897c4b014e5 node02=sn-b.hz.nue.ff-e.net=6ed15e1d0d4774d4eccea568d6f8637f47749b82a3e7be336620c7ff89f1f9a7 node03=sn-a.ak.ber.ff-e.net=d65b0b6e2f52ec824bc5a5ef20f5841ef9d781999de178dcde35b43059e9d2e9 node04=sn-b.ak.ber.ff-e.net=e3d483cf949a4cb242c851f58735f8a53ee624ccb146d3559e7a168fbdd415c5
