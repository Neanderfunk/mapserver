# Domains, die statt Tunneldigger per fastd ins Mesh gehen.
#
# Steht eine Domain aus domains.conf auch hier, startet tunnel-start.sh fastd
# statt des Tunneldigger-Clients. Alles andere bleibt gleich: dieselbe
# Schnittstelle td-<code>, derselbe Hook, dieselbe batman-Instanz, derselbe
# Watchdog. Port und MTU kommen weiter aus domains.conf.
#
# Unser Schluessel ist je Community einer (/etc/karte-en/fastd/<community>.secret,
# beim ersten Start erzeugt). Wer uns sperren oder freischalten will, sieht so
# genau eine Kennung je Community. Der oeffentliche Teil liegt daneben in
# <community>.pub.
#
# Spalten: code, Methoden (Komma, Reihenfolge wie bei Gluon), dann je Peer
# name=host=schluessel. Alle Peers kommen in eine Gruppe mit limit 1, wie auf
# einem Gluon-Knoten: fastd verbindet sich mit dem ersten, der antwortet.
#
# code  methoden        peers
# --- Freifunk Essen -----------------------------------------------------------
# site.conf: github.com/bwildenhain/site-ffe (Gluon v2019.1); Gegenseite in
# github.com/FFEssen/supernode-ansible (fastd_essen.conf.j2, 25.09.2026):
# Port 10000, salsa2012+umac und null, MTU 1280, on verify nur mit Sperrliste.
# Von den vier Supernodes loest am 25.09.2026 nur sn-a.hz.nue auf.
ffe   salsa2012+umac  node01=sn-a.hz.nue.ff-e.net=6e3c1e8713e2366fb514175a9beea81c238a5f5b59adf70242472897c4b014e5 node02=sn-b.hz.nue.ff-e.net=6ed15e1d0d4774d4eccea568d6f8637f47749b82a3e7be336620c7ff89f1f9a7 node03=sn-a.ak.ber.ff-e.net=d65b0b6e2f52ec824bc5a5ef20f5841ef9d781999de178dcde35b43059e9d2e9 node04=sn-b.ak.ber.ff-e.net=e3d483cf949a4cb242c851f58735f8a53ee624ccb146d3559e7a168fbdd415c5
# --- Freifunk Hildesheim ------------------------------------------------------
# github.com/ffhi/ffhi-site (07/2025), Domain nordstadt: gw01 Port 10101,
# salsa2012+umac und null, MTU 1426. Alle 17 Domains dort zeigen auf dieselbe
# Adresse (152.53.133.243, nur IPv4) mit demselben Schluessel; angekuendigt ist
# EIN Tunnel zu gw01. Schluesselfreischaltung per Mail beantragt 26.09.2026.
ffhi  salsa2012+umac,null  gw01=gw01.freifunk-hildesheim.de=b3d108c68981b96e6b29bcfd33aa8f44c105d280715d3a91bd11604a00a30a7f
# --- Freifunk Wuppertal -------------------------------------------------------
# Not-Karte (adorfer 23.11.2026), siehe domains.conf. Schluessel aus den
# Firmware-Images (quellen/ffw-site der mitfunken-Session). Feld- und Testbau
# nutzen dieselben Peers und Schluessel; beide fahren salsa2012+umac (die
# Feldfirmware ohne null). Von zehn Peers loesen am 23.11. nur vier auf, alle
# IPv4: wupper0, wupper1, wupper7, wupper8. Port und MTU aus domains.conf
# (42042, 1426). Ob die Gateways fremde Schluessel annehmen, ist unbekannt;
# fruehere Kontaktversuche nach Wuppertal sind gescheitert, also versucht fastd
# es wie jeder Gluon-Knoten von selbst weiter.
ffw   salsa2012+umac  wupper0=wupper0.ffwtal.net=e52daa654abcf5c20c5b7a74b5145f70a7491435c6ef334ae352e4f19c00e8f5 wupper1=wupper1.ffwtal.net=6eae041199ee627689bfa026afbd8a9ab299eca8aed4144321d098cffd62668e wupper7=wupper7.ffwtal.net=9916d2e9e89452ae7e1b9c58038a3b16b75e49d51afd0440d915adcdac561739 wupper8=wupper8.ffwtal.net=332bfb0c3c4bba4a5c7f36721ff52f484603bf2a4a233a3776e9d4f8b9567078
