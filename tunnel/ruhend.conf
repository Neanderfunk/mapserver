# Domains, in denen keine Knoten zu erwarten sind.
#
# Der Tunnel wird trotzdem aufgebaut, denn eine ruhende Domain kann wieder
# belegt werden, und dann soll sie ohne Zutun auf der Karte erscheinen. Die
# Ueberwachung meldet hier aber keinen Fehler, wenn nichts antwortet: eine
# leere Karte ist der erwartete Zustand, kein Ausfall.
#
# Erste Spalte der Domaincode, danach die Begruendung. Beginnt sie mit
# WARTET, wartet die Domain auf etwas von aussen (Freischaltung); Checkmk meldet
# dann WARN, sobald der Tunnel einen Nachbarn hat.
ffhi      WARTET 26.09.2026: Hildesheim, Schluessel noch nicht freigeschaltet (Anmeldung per Mail); Checkmk meldet WARN, sobald der Tunnel steht, dann Zeile entfernen
