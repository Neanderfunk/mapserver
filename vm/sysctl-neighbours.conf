# /etc/sysctl.d/90-karte-neighbours.conf
#
# IPv6-Nachbartabelle (ndisc) fuer einen Kartenserver in vielen Meshes.
#
# Debian-Vorgabe ist gc_thresh3 = 1024. map6 haengt in 49 Meshes und spricht
# in jeder Sammelrunde mit weit ueber tausend Knoten (Antworten, yanic-
# Unicast-Nachfragen). Die Tabelle lief dabei voll ("neighbor table
# overflow!", 3050 Meldungen am 25.09.2026 bis 23 Uhr), und jedes sendto zu
# einem Ziel ohne Eintrag scheiterte mit EINVAL: unifi-respondd stuerzte so
# 61-mal ab, alle fuenf Minuten bei der Sammelrunde, mesh-announce konnte
# kaum antworten. Die Werte lassen reichlich Luft; ein Eintrag kostet einige
# hundert Byte.
net.ipv6.neigh.default.gc_thresh1 = 4096
net.ipv6.neigh.default.gc_thresh2 = 8192
net.ipv6.neigh.default.gc_thresh3 = 16384
