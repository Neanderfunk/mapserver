# Weitere Namen je Karte, zusaetzlich zu <ort>.<community>.map.freifunk.space.
# Gelesen von konfig-erzeugen.py, liegt auf der VM als /etc/karte-en/namen.conf.
#
# Erste Spalte der Pfad unter sites/ (neander/alle ist die Gesamtkarte),
# danach Namen, wie nginx sie in server_name versteht: genau oder mit "*." vorn.
# Ein genauer Name geht in nginx vor jeder Wildcard. Eine Ortskarte kann sich
# also lvr.karte.ffnef.de nehmen, waehrend *.karte.ffnef.de die Gesamtkarte ist.
#
# Die alten Namen der Neanderfunk-Karte (adorfer 04.11.2026). TLS endet davor
# auf dem Proxy, hier kommt nur Port 80 an.
neander/alle  karte.neanderfunk.de map.neanderfunk.de
neander/alle  karte.ffdus.de map.ffdus.de
neander/alle  karte.ffnef.de map.ffnef.de
# Alle Subdomains darunter ebenfalls auf die Gesamtkarte
neander/alle  *.karte.neanderfunk.de *.map.neanderfunk.de
neander/alle  *.karte.ffdus.de *.map.ffdus.de
neander/alle  *.karte.ffnef.de *.map.ffnef.de
# Aus der alten Kartenkonfiguration (eulenfunk/mapconfig, Branch wireguard,
# sites), soweit der Name schon auf den Proxy zeigt. Dort war es die
# Sammelkarte Siegerland (Domains 37 bis 42).
neander/alle  map.freifunk-siegerland.de
# Sammelkarte LVR (gruppen.conf). Genaue Namen, gehen also den Wildcards oben vor.
neander/lvr   lvr.karte.neanderfunk.de lvr.karte.ffnef.de
# Namen des alten Kartenservers, zeigen seit 04.11.2026 auf den Proxy
# (adorfer). Wuppertal (wup.map.eulenfunk.de, map.freifunk-wuppertal.net)
# bekommt kein Zertifikat, faellt aber unter die Wildcard.
neander/alle  map1.ffdus.de map.eulenfunk.de *.map.eulenfunk.de
neander/alle  map.gl.wupper.ffrl.de map.leichlingen.freifunk.net
neander/lvr   lvr.map.eulenfunk.de
