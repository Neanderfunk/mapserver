# Weitere Namen je Karte, zusaetzlich zu <ort>.<community>.map.freifunk.space.
# Gelesen von konfig-erzeugen.py, liegt auf der VM als /etc/karte-en/namen.conf.
#
# Erste Spalte der Pfad unter sites/ (neander/alle ist die Gesamtkarte,
# neander/lvr die Sammelkarte aus gruppen.conf), danach Namen, wie nginx sie
# in server_name versteht: genau oder mit "*." vorn. Ein genauer Name geht in
# nginx vor jeder Wildcard.
#
#   <pfad> <name...>             dieser Vhost liefert die Karte auch unter <name>
#   <pfad> umleiten <name...>    301 auf den ersten Namen des Pfads
#
# Eine Karte, ein Name: alles andere leitet um, weil Google dieselbe Seite
# unter vielen Namen als doppelten Inhalt abwertet (adorfer 04.11.2026). Der
# Name der Gesamtkarte ist seit 04.11.2026 abends karte.neanderfunk.de, davor
# kurz map.ffnef.de (adorfer). TLS
# endet davor auf dem Proxy, hier kommt nur Port 80 an.
neander/alle  karte.neanderfunk.de
neander/lvr   lvr.map.ffnef.de

# Alte Namen der Neanderfunk-Karte, der Firmware (sites.nefall.sta:
# map.ffdus.de, map.freifunk-siegerland.de) und des
# alten Kartenservers. Wuppertal (wup.map.eulenfunk.de) faellt unter die
# Wildcard, steht aber nicht im Zertifikat.
neander/alle  umleiten map.ffnef.de map.neanderfunk.de karte.ffdus.de map.ffdus.de karte.ffnef.de
neander/alle  umleiten map1.ffdus.de map.eulenfunk.de map.freifunk-siegerland.de
neander/alle  umleiten map.gl.wupper.ffrl.de map.leichlingen.freifunk.net
neander/alle  umleiten *.karte.neanderfunk.de *.map.neanderfunk.de *.karte.ffdus.de *.map.ffdus.de
neander/alle  umleiten *.karte.ffnef.de *.map.ffnef.de *.map.eulenfunk.de
# Die frueheren Ortskarten (<ort>.neander.map.freifunk.space), abgeschaltet
# 04.11.2026; neander.map.freifunk.space selbst ist ein genauer Name und bleibt.
neander/alle  umleiten *.neander.map.freifunk.space

# LVR: Sammelname und die alten Namen der sieben Domains (11, 31 bis 36)
neander/lvr   umleiten lvr.karte.neanderfunk.de lvr.karte.ffnef.de lvr.map.eulenfunk.de
neander/lvr   umleiten nef11lvr.karte.neanderfunk.de nef31lvrno.karte.neanderfunk.de
neander/lvr   umleiten nef32lvrnw.karte.neanderfunk.de nef33lvrmo.karte.neanderfunk.de
neander/lvr   umleiten nef34lvrmw.karte.neanderfunk.de nef35lvrso.karte.neanderfunk.de
neander/lvr   umleiten nef36lvrsw.karte.neanderfunk.de
