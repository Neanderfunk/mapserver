# /etc/nginx/conf.d/karte-geo.conf - gehoert in den http-Kontext.
#
# Adresse zum gewaehlten Punkt in der Standortwahl der Karte (meshviewer:
# reverseGeocodingApi). Ohne uns fragte der Browser jeder Besucherin direkt bei
# nominatim.openstreetmap.org, ein fremder Dienst erfuhr also Adresse und
# Standort. Regel: fremde Dienste nur ueber eigenen Proxy mit Cache
# (adorfer 25.09.2026, wie Kacheln und Bibliotheken).
#
# Weiter geht nur, was Nominatim braucht: Breite und Laenge auf 5
# Nachkommastellen gekuerzt (rund 1 m, genauer wird die Adresse ohnehin
# nicht; das hilft zugleich dem Cache), und die Sprache. Keine Kopfzeilen der
# Besucherin, keine Adresse.

proxy_cache_path /var/cache/nginx/karte-geo levels=1:2 keys_zone=kartegeo:5m
                 max_size=64m inactive=30d use_temp_path=off;

# Je Besucherin 30 je Minute, und alle zusammen hoechstens eine je Sekunde:
# die Nutzungsregeln von Nominatim erlauben nicht mehr.
limit_req_zone $binary_remote_addr zone=karteort:1m rate=30r/m;
map $host $karte_geo_alle { default alle; }
limit_req_zone $karte_geo_alle zone=karteortalle:1m rate=1r/s;

map $arg_lat $karte_geo_lat {
	"~^(?<kglat>-?[0-9]{1,2}(\.[0-9]{1,5})?)" $kglat;
	default "";
}
map $arg_lon $karte_geo_lon {
	"~^(?<kglon>-?[0-9]{1,3}(\.[0-9]{1,5})?)" $kglon;
	default "";
}
map $args $karte_geo_sprache {
	"~(^|&)accept-language=(?<kgsp>[a-z]{2})" $kgsp;
	default de;
}
