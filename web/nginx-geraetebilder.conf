# Von web/einrichten.sh als conf.d/karte-geraetebilder.conf installiert.
#
# Ersatzbilder fuer Modelle, die freifunk/device-pictures nicht unter ihrem
# Namen fuehrt, aber ein passendes Bild hat (adorfer 06.10.2026). Die Karte
# fragt /pictures-svg/<modell>.svg; der Vhost sucht der Reihe nach das Bild
# aus device-pictures, ein eigenes Foto in pictures-eigen/ (SVG oder JPG,
# Quelle web/geraetebilder/) und zuletzt das Ersatzbild von hier.
#
# Nur, was dasselbe Geraet oder dieselbe Art Geraet zeigt: VMs und x86 sind
# keine Router, ein Foto gaebe es nicht; die Symbole der x86-Images passen.
map $uri $geraetebild_ersatz {
	default "";
	# Virtuelle Maschinen; QEMU-Namen wechseln mit Version und Distribution
	~^/pictures-svg/(kvm-virtualmachine|kartenserver-vm|qemu-.*)\.svg$	x86-kvm.img;
	~^/pictures-svg/vmware-.*\.svg$						x86-vmware.vmdk;
	~^/pictures-svg/innotek-gmbh-virtualbox\.svg$				x86-virtualbox.vdi;
	# x86-Hardware: FUTROs, Boards ohne Herstellerangabe ("Default string")
	~^/pictures-svg/(fujitsu-.*futro-.*|default-string-default-string)\.svg$	x86-generic.img;
	# Gleiches Geraet, anderer Name als in device-pictures
	~^/pictures-svg/ubiquiti-unifi-ap-outdoor\.svg$				ubiquiti-unifiap-outdoor-;
	~^/pictures-svg/tp-link-tl-wr2543n-nd\.svg$				tp-link-tl-wr2543n-nd-v1;
}
