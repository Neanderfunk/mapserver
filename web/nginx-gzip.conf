# Von web/einrichten.sh installiert. Debian schaltet gzip ein, komprimiert
# aber nur text/html: meshviewer.json (1,9 MB, rund 270 KB gepackt), das
# JS-Bundle und targets.json gingen ungepackt raus (bemerkt 27.09.2026).
# Die Daten ändern sich jede Minute, also on the fly statt gzip_static.
gzip_types text/plain text/css text/javascript application/javascript
	application/json application/manifest+json image/svg+xml;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_vary on;
