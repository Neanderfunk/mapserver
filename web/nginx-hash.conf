# Von web/einrichten.sh installiert. Die Vhost-Namen der Ortskarten sind lang
# (dusukw.neander.map.freifunk.space und Verwandte); mit der Vorgabe 64 baut
# nginx die server_names-Tabelle nicht mehr und startet gar nicht. Ein
# laufender nginx merkt das erst beim naechsten Reload oder Neustart
# (gefunden 22.09.2026, beim Reboot waeren alle Karten weg gewesen).
server_names_hash_bucket_size 128;
