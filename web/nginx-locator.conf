#
# locator.ffnef.de: Annahme der HVB-Ortung (Konzept Neanderfunk/packages
# docs/konzept-hvb-ortung.md, Entscheidung E7). Gluon-Knoten in 25_hvb
# schicken einmal am Tag per POST ihren WLAN-Scan. TLS endet auf dem Proxy
# davor; der reicht http und https ohne Umleitung durch, weil Knoten ohne
# TLS im Image http nehmen und ein POST keine 301 uebersteht.
#
# Stand: Platzhalter. POST auf /hvb/locate bekommt 202, der Inhalt wird
# verworfen und nirgends gespeichert. Der Dienst dahinter kommt spaeter.
server {
	listen 80;
	listen [::]:80;
	server_name locator.ffnef.de;

	# Kein Inhalt im Log: nur Zeit, Absender laut Proxy, Anfrage, Status
	access_log /var/log/nginx/locator.log karte_locator;
	client_max_body_size 64k;

	location = /hvb/locate {
		if ($request_method != POST) {
			return 405;
		}
		return 202;
	}

	# HVB-Manifest des nodeplacer (Konzept 4.5), noch keins da
	location /hvb/nodeplacer {
		return 404;
	}

	location / {
		return 404;
	}
}
