# Communities im Standby: der Aufbau bleibt vollstaendig stehen, aber die
# Dienste laufen nicht, und ihre Namen leiten dauerhaft auf die Karte der
# Community selbst um.
#
# Gedacht fuer den Fall, fuer den dieses Projekt gebaut wurde: wir messen das
# Netz einer Community, die keine Karte hat, und hoeren damit auf, sobald sie
# wieder eine hat. Die Zeitreihe in /var/lib/karte/verlauf.csv bleibt.
#
# Erste Spalte die Community, zweite das Umleitungsziel, danach die
# Begruendung. Wiederbelebung: Zeile entfernen, karte-en-konfig laufen lassen,
# Dienste wieder enable --now.
en   https://map.ff-en.de/   Freifunk EN betreibt eine eigene Karte (adorfer 23.09.2026)
