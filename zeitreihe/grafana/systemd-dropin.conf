# /etc/systemd/system/grafana-server.service.d/neanderfunk.conf
#
# Grafana dient hier nur als Vertiefung hinter dem Link im Knotenfenster:
# lesen, keine Konten, keine Anmeldung. Die Diagramme in der Karte selbst
# zeichnet meshviewer ohne Grafana (zeitreihe/, patches/meshviewer.patch).
#
# Alles ueber Umgebungsvariablen, damit die Paketdateien unberuehrt bleiben
# und ein Update sie nicht ueberschreibt.
[Service]
# Erreichbar nur ueber nginx unter /grafana/ auf der Kartendomain
Environment=GF_SERVER_HTTP_ADDR=127.0.0.1
Environment=GF_SERVER_ROOT_URL=https://neander.map.freifunk.space/grafana/
Environment=GF_SERVER_SERVE_FROM_SUB_PATH=true
# Oeffentlich lesend, ohne Anmeldung. Die Anmeldemaske bleibt aus: an einer
# oeffentlichen Instanz ist sie nur eine Angriffsflaeche, und wir brauchen sie
# nicht, weil Datenquelle und Dashboards aus Dateien kommen.
Environment=GF_AUTH_ANONYMOUS_ENABLED=true
Environment=GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
Environment=GF_AUTH_DISABLE_LOGIN_FORM=true
Environment=GF_AUTH_BASIC_ENABLED=false
Environment=GF_USERS_ALLOW_SIGN_UP=false
Environment=GF_USERS_VIEWERS_CAN_EDIT=false
Environment=GF_SNAPSHOTS_EXTERNAL_ENABLED=false
Environment=GF_ALERTING_ENABLED=false
Environment=GF_UNIFIED_ALERTING_ENABLED=false
# Nichts nach draussen: keine Nutzungsstatistik, keine Updatepruefung, keine
# Nachrichtenleiste, keine Schriften von fremden Servern.
Environment=GF_ANALYTICS_REPORTING_ENABLED=false
Environment=GF_ANALYTICS_CHECK_FOR_UPDATES=false
Environment=GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
Environment=GF_NEWS_NEWS_FEED_ENABLED=false
Environment=GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED=true
# Ein Kern gehoert der Karte, Grafana bekommt den Rest
CPUWeight=50
MemoryHigh=400M
