	# Zeitreihen aus VictoriaMetrics, nur lesend. Alles andere unter /nf/prom/
	# (Schreiben, Import, Loeschen, Admin) bleibt draussen.
	location ~ ^/nf/prom/(api/v1/(query|query_range|series|labels|label/[A-Za-z0-9_.]+/values|export|status/tsdb)|federate)$ {
		rewrite ^/nf/prom/(.*)$ /$1 break;
		proxy_pass http://127.0.0.1:8428;
		proxy_read_timeout 40s;
		# VictoriaMetrics setzt den CORS-Kopf selbst. Zusammen mit unserem
		# waeren es zwei, und ein Browser lehnt das ab (23.09.2026).
		proxy_hide_header Access-Control-Allow-Origin;
		add_header Access-Control-Allow-Origin "*";
		add_header Cache-Control "no-cache";
	}
	location /nf/prom/ {
		return 403;
	}

	# Grafana als Vertiefung hinter dem Link im Knotenfenster. Lesend und
	# ohne Anmeldung, siehe grafana/systemd-dropin.conf. Die Diagramme in der
	# Karte selbst kommen ohne Grafana aus.
	# Grafanas Datenquellen-Proxy reicht jede Anfrage an die Datenbank durch,
	# auch fuer anonyme Besucher und auch an die Verwaltungsfunktionen: am
	# 24.09.2026 antwortete delete_series darueber mit 204. Die Dashboards
	# brauchen ihn nicht, sie fragen ueber /api/ds/query und die
	# Ressourcen-Schnittstelle. Die Liste der Datenquellen verraet zudem die
	# interne Adresse der Datenbank. Beides bleibt draussen; die Datenbank
	# verlangt fuer ihre Verwaltung ausserdem einen Schluessel.
	location ^~ /grafana/api/datasources/proxy/ {
		return 403;
	}
	location = /grafana/api/datasources {
		return 403;
	}

	location /grafana/ {
		# Ohne Schraegstrich am Ende, damit das Praefix /grafana/ erhalten
		# bleibt: Grafana laeuft mit serve_from_sub_path und wuerde sonst
		# endlos auf sich selbst umleiten (23.09.2026).
		proxy_pass http://127.0.0.1:3000;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 60s;
	}
