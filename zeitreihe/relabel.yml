# Wird auf alles angewandt, was hereinkommt, vor dem Speichern.
#
# yanic schreibt in den Influx-Ausgang die Kontaktangabe des Knotens als Tag
# "owner". no_owner gibt es nur fuer die Kartenausgaben, nicht fuer die
# Datenbank. Die Zeitreihen sind ueber /nf/prom/ oeffentlich lesbar, und wer
# einen Kontakt in seinen Knoten eingetragen hat, hat das nicht fuer unsere
# Veroeffentlichung getan (docs/hintergrund.md, no_owner).
- action: labeldrop
  regex: owner

# yanic haengt die Frequenz je Band als Label an jeden Punkt. Wechselt ein
# Knoten den Kanal, etwa nach einem Neustart, entsteht dadurch eine neue
# Zeitreihe: neue Farbe, neuer Eintrag in der Legende. Ein Geraet kam so in 24
# Stunden auf 16 Reihen (23.09.2026). Die Frequenz geht dabei nicht verloren,
# sie steht als eigener Messwert node_airtime11a.frequency daneben.
- action: labeldrop
  regex: frequency11.*
