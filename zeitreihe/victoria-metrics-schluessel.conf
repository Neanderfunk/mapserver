# /etc/systemd/system/victoria-metrics.service.d/schluessel.conf
#
# Verwaltungsfunktionen von VictoriaMetrics brauchen einen Schluessel:
# Loeschen, Neuladen, Flags, interne Metriken, Profiling, Snapshots,
# Zusammenfuehren, Cache leeren. Ohne ihn sind sie fuer jeden offen, der mit
# der Datenbank sprechen kann, und das konnte bis 24.09.2026 jeder im
# Internet: Grafanas Datenquellen-Proxy reichte anonyme Anfragen durch,
# delete_series antwortete mit 204.
#
# Lokal lauschen allein reicht also nicht. Der Schluessel selbst steht nur
# auf der Maschine (/etc/victoria-metrics/geheim.env, 0600), erzeugt von
# zeitreihe/einrichten.sh. Abfragen, Schreiben und /health brauchen ihn nicht.
[Service]
EnvironmentFile=/etc/victoria-metrics/geheim.env
ExecStart=
ExecStart=/usr/bin/victoria-metrics $ARGS $GEHEIM
