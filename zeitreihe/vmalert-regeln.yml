#
# Vorberechnete Reihen fuer die Diagramme im Reiter "Statistiken" der Karte
# (web/konfig-erzeugen.py, STATISTIKDIAGRAMME). Installiert von
# zeitreihe/vmalert-einrichten.sh nach /etc/victoria-metrics/, ausgewertet von
# karte-vmalert.service.
#
# Der Datenverkehr des ganzen Netzes ist eine Summe ueber alle Gluon-Knoten,
# rund 1600 Reihen. Beim Oeffnen der Karte jedes Mal sieben Tage davon
# zusammenzurechnen, waere unnoetige Last (adorfer 26.11.2026: "schon
# gecached"). vmalert rechnet die Summe alle fuenf Minuten einmal, im Takt
# der Sammelrunde von yanic, und schreibt sie als eigene Reihe zurueck. Das
# Diagramm liest dann nur noch fuenf Reihen.
#
# Dieselbe Rechnung wie Panel 3 "Verkehr" der Gesamtsicht in Grafana
# (zeitreihe/grafana/dashboard-erzeugen.py, verkehr()): Summe ueber die
# Gluon-Knoten aus deren Sicht. UniFi-APs zaehlen nicht, ihr Verkehr laeuft
# auch ueber das LAN ihres Routers; die Gateways saehen alles noch einmal.
#
# rate() je Knoten ohne +Inf: Seit 24.11.2026 fragt yanic zwei Gruppen ab
# (sammler/yanic-conf.py, ABFRAGE), und ein Knoten, der auf beide antwortet,
# kam zweimal mit demselben Zeitstempel und leicht verschiedenem Zaehler an.
# Fehlte ihm davor eine Runde, teilte rate() durch null Sekunden, und ein
# einziger solcher Knoten machte die ganze Summe +Inf (am 26.11.2026 94 von
# 2305 Punkten in acht Tagen, je zwei oder drei Knoten). Seit dem Abend des
# 26.11.2026 legt VictoriaMetrics solche Punkte zusammen
# (dedup.minScrapeInterval in victoria-metrics.default). "< +Inf" bleibt als
# Schutz: ein einziger Ausreisser soll nie wieder die ganze Summe kippen.
#
# Name nf_karte:, nicht nf_netz:. Die erste Fassung vom 26.11.2026 ohne
# Filter schrieb nf_netz:verkehr_bps, samt der +Inf-Punkte; sie wird nicht
# mehr geschrieben.
#
# Router und Clients brauchen hier nichts: yanic schreibt sie in jeder Runde
# schon als Gesamtzahl (global_nodes, global_gateways, global_clients.total).

groups:
  - name: karte-statistik
    interval: 5m
    rules:
      - record: nf_karte:verkehr_bps
        expr: sum(rate({__name__="node_traffic.rx.bytes", db="neander", firmware_base=~"gluon.*"}[10m]) < +Inf) * 8
        labels:
          db: neander
          richtung: Download
      - record: nf_karte:verkehr_bps
        expr: sum(rate({__name__="node_traffic.tx.bytes", db="neander", firmware_base=~"gluon.*"}[10m]) < +Inf) * 8
        labels:
          db: neander
          richtung: Upload
      - record: nf_karte:verkehr_bps
        expr: sum(rate({__name__="node_traffic.forward.bytes", db="neander", firmware_base=~"gluon.*"}[10m]) < +Inf) * 8
        labels:
          db: neander
          richtung: weitergeleitet
      - record: nf_karte:verkehr_bps
        expr: sum(rate({__name__="node_traffic.mgmt_rx.bytes", db="neander", firmware_base=~"gluon.*"}[10m]) < +Inf) * 8
        labels:
          db: neander
          richtung: Verwaltung empfangen
      - record: nf_karte:verkehr_bps
        expr: sum(rate({__name__="node_traffic.mgmt_tx.bytes", db="neander", firmware_base=~"gluon.*"}[10m]) < +Inf) * 8
        labels:
          db: neander
          richtung: Verwaltung gesendet
